[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presidio-mena"
version = "0.1.0"
description = "Microsoft Presidio recognizers for MENA identifiers: Moroccan CIN, RIB, ICE, IBAN and phone numbers, with check-digit validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Novagios", email = "contact@novagios.com" }]
keywords = ["presidio", "pii", "anonymization", "morocco", "mena", "arabic", "gdpr", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Arabic",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["presidio-analyzer>=2.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/novagiosAI/presidio-mena"
Repository = "https://github.com/novagiosAI/presidio-mena"
Issues = "https://github.com/novagiosAI/presidio-mena/issues"
Changelog = "https://github.com/novagiosAI/presidio-mena/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_mena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/presidio_mena"]

[[tool.mypy.overrides]]
module = "presidio_analyzer.*"
ignore_missing_imports = true
